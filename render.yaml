databases:
  - name: storefrontbot-db
    plan: free
    databaseName: storefrontbot
    user: storefrontbot

services:
  - type: web
    name: storefrontbot
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install pipenv && pipenv install --system --deploy && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storefrontbot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false